<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro de productos</title>
</head>
<body>
  <h1>Registrar producto</h1>

  <form method="post">
    <label>Nombre:
      <input name="nombre" required>
    </label>
    <br>

    <label>Categoría:
      <input name="categoria" required>
    </label>
    <br>

    <label>Precio:
      <input name="precio" type="number" step="0.01" min="0" required>
    </label>
    <br>

    <button type="submit">Guardar</button>
  </form>

  <h2>Productos guardados</h2>
  <ul>
    {% for producto in productos %}
      <li>{{ producto[1] }} — {{ producto[2] }} — ${{ "%.2f"|format(producto[3]) }}</li>
    {% else %}
      <li>Aún no hay productos.</li>
    {% endfor %}
  </ul>
</body>
</html>
